<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trading Bot alerts</title>
<!-- The small always-on-top window app/main.py puts at the top right of the screen. It only shows while the app isn't
     in front: the main window sends each notification here (window.addNote), and this page sizes the window to fit
     its cards and hides it when the last one has faded. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e1013; --text: #e6e3da; --muted: #9aa0a8; --gold: #c9a24a; --up: #3fb68b; --down: #e0574f; --ease: cubic-bezier(.34, 1.56, .64, 1); }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  #notes { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .note { position: relative; overflow: hidden; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px 12px;
    border-radius: 10px; background: #181c22; border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset; cursor: pointer;
    animation: in .38s var(--ease) both; }
  .note::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
  .note.tp::before, .note.ok::before { background: var(--up); } .note.sl::before, .note.err::before { background: var(--down); }
  svg { width: 20px; height: 20px; fill: none; stroke: var(--gold); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tp svg, .ok svg { stroke: var(--up); } .sl svg, .err svg { stroke: var(--down); }
  b { display: block; font-size: 13px; font-weight: 600; } .tp b { color: var(--up); } .sl b, .err b { color: var(--down); }
  span { color: #c9ccd2; font-size: 12.5px; overflow-wrap: anywhere; }
  em { font: 600 15px "IBM Plex Mono", Consolas, monospace; font-style: normal; } em.up { color: var(--up); } em.down { color: var(--down); }
  i { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--gold); opacity: .35; transform-origin: left; animation: life linear forwards; }
  .tp i { background: var(--up); } .sl i, .err i { background: var(--down); }
  .note.hold i { animation-play-state: paused; }
  .note.out { animation: out .3s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translate3d(28px, 0, 0) scale(.97); } }
  @keyframes out { to { opacity: 0; transform: translate3d(18px, 0, 0) scale(.98); } }
  @keyframes life { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
</head>
<body>
<div id="notes" aria-live="polite"></div>
<script>
  const box = document.getElementById("notes");
  const ICON = {
    info: '<path d="M12 8h.01M11 12h1v5h1"/><circle cx="12" cy="12" r="9"/>',
    ok: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.7"/>',
    err: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>',
    tp: '<path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/>',
    sl: '<path d="M4 7l5 5 4-3 7 8"/><path d="M15 17h5v-5"/>',
  };
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const api = () => window.pywebview && window.pywebview.api;
  function fit() {                                 // the window is as tall as its cards; hidden when there are none
    const a = api(); if (!a) return;
    const live = box.querySelectorAll(".note:not(.out)").length;
    if (!live && !box.children.length) a.idle(); else a.fit(Math.ceil(box.getBoundingClientRect().height));
  }
  function out(el) {
    if (el._gone) return; el._gone = true; el.classList.add("out");
    setTimeout(() => { el.remove(); fit(); }, 300);
  }
  // tell the app this page is up, so notifications sent while it loaded are shown now
  window.addEventListener("pywebviewready", () => { const a = api(); if (a && a.ready) a.ready(); });
  window.addNote = p => {                          // p = {title, body, kind, amount (text), secs}
    const kind = ICON[p.kind] ? p.kind : "info", el = document.createElement("div");
    el.className = `note ${kind}`;
    const amt = p.amount == null ? "" : `<em class="${String(p.amount).startsWith("-") ? "down" : "up"}">${esc(p.amount)}</em>`;
    el.innerHTML = `<svg viewBox="0 0 24 24">${ICON[kind]}</svg><div>${p.title ? `<b>${esc(p.title)}</b>` : ""}${p.body ? `<span>${esc(p.body)}</span>` : ""}</div>${amt}<i style="animation-duration:${+p.secs || 2}s"></i>`;
    box.appendChild(el);                           // newest below the others
    while (box.querySelectorAll(".note:not(.out)").length > 5) out(box.querySelector(".note:not(.out)"));
    fit();
    let left = (+p.secs || 2) * 1000, t0 = performance.now(), timer = setTimeout(() => out(el), left);
    el.addEventListener("mouseenter", () => { clearTimeout(timer); left -= performance.now() - t0; el.classList.add("hold"); });
    el.addEventListener("mouseleave", () => { t0 = performance.now(); el.classList.remove("hold"); timer = setTimeout(() => out(el), Math.max(500, left)); });
    el.addEventListener("click", () => { clearTimeout(timer); out(el); });
  };
</script>
</body>
</html>
